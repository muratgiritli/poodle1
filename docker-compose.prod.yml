# YourPoodle — Hetzner / VPS production stack
# Usage:
#   1) cp .env.example .env   (fill DATABASE_URL is auto-set below if using compose DB)
#   2) docker compose -f docker-compose.prod.yml up -d --build
#
# App: http://SERVER_IP:5000  (put Nginx/Caddy in front for HTTPS + yourpoodle.com)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yourpoodle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-yourpoodle}
    volumes:
      - yp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yourpoodle} -d ${POSTGRES_DB:-yourpoodle}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-yourpoodle}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yourpoodle}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://api.iyzipay.com}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-}
      NETGSM_USERCODE: ${NETGSM_USERCODE:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}

volumes:
  yp_pgdata:
